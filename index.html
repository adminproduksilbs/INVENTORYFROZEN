<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stok Inventory Frozen - PT Lampung Bay Seafood</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="loginPage">
  <div class="login-card">
    <div class="logo">LBS</div>
    <h1>LBS Inventory</h1>
    <p>PT Lampung Bay Seafood</p>
    <div class="login-tabs">
      <button type="button" id="adminLoginTab" class="login-tab active">Admin</button>
      <button type="button" id="operatorLoginTab" class="login-tab">Operator</button>
    </div>
    <div id="adminLoginFields">
      <input id="email" type="email" placeholder="Email Admin">
      <input id="password" type="password" placeholder="Password">
    </div>
    <div id="operatorLoginFields" class="hidden">
      <input id="operatorPin" type="password" inputmode="numeric" maxlength="4" minlength="4" placeholder="PIN Operator (4 digit)" autocomplete="off">
      <p class="small login-note">Masukkan PIN Operator 4 digit.</p>
    </div>
    <button id="loginBtn" class="primary">Masuk</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<div id="appPage" class="hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand brand-custom"><img src="logo-lbs.png" alt="LBS"><div><strong>Stok inventory frozen</strong><small>PT LAMPUNG BAY SEAFOOD</small></div></div>
    <button class="nav active" data-page="dashboard">🏠 <span>Dashboard</span></button>
    <button class="nav" data-page="production">🏭 <span>Produksi</span></button>
    <button class="nav" data-page="transactions">🔄 <span>Stok Masuk/Keluar</span></button>
    <button class="nav" data-page="opname">📝 <span>Stok Opname</span></button>
    <button class="nav" data-page="reports">📄 <span>Laporan</span></button>
    <button class="nav" data-page="products">📦 <span>Produk</span></button>
    <button class="nav admin-only" data-page="users">👥 <span>Pengguna</span></button>
    <div class="side-bottom">
      <span id="userName"></span>
      <button id="logoutBtn" class="danger">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button id="menuBtn" class="menu-btn" aria-label="Menu">☰</button>
      <div class="topbar-title"><span class="eyebrow">LBS INVENTORY FROZEN</span><b id="pageTitle">Dashboard</b></div>
      <div class="topbar-right"><span class="online-pill" id="onlinePill"><i></i> Online</span><span class="today" id="todayText"></span><div class="profile-mini"><span class="avatar">👤</span><div><b id="topUserName">Admin Produksi</b><small id="topUserRole">Administrator</small></div></div></div>
    </div>
    <section id="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" id="closeModal">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
