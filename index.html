<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stok Inventory Frozen - PT Lampung Bay Seafood</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
<div id="loginPage">
  <div class="login-card">
    <div class="logo">LBS</div>
    <h1>LBS Inventory</h1>
    <p>PT Lampung Bay Seafood</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" class="primary">Masuk</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<div id="appPage" class="hidden">
  <aside class="sidebar">
    <div class="brand brand-custom"><img src="logo-lbs.png" alt="LBS"><div><strong>Stok inventory frozen</strong><small>PT LAMPUNG BAY SEAFOOD</small></div></div>
    <button class="nav active" data-page="dashboard">🏠 Dashboard</button>
    <button class="nav" data-page="products">📦 Produk</button>
    <button class="nav" data-page="inventory">📊 Inventory</button>
    <button class="nav" data-page="transactions">🔄 Stok Masuk/Keluar</button>
    <button class="nav" data-page="opname">📝 Stok Opname</button>
    <button class="nav" data-page="reports">📄 Laporan</button>
    <button class="nav admin-only" data-page="users">👥 Pengguna</button>
    <div class="side-bottom">
      <span id="userName"></span>
      <button id="logoutBtn" class="danger">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button id="menuBtn" class="menu-btn">☰</button>
      <div><b id="pageTitle">Dashboard</b></div>
    </div>
    <section id="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" id="closeModal">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
