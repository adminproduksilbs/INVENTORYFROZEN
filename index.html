<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LBS Inventory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginPage">
  <div class="card">
    <h1>LBS Inventory</h1>
    <p>PT Lampung Bay Seafood</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Masuk</button>
    <p id="loginError"></p>
  </div>
</div>

<div id="appPage" class="hidden">
<header><h1>LBS Inventory</h1><div><span id="userName"></span> <button id="logoutBtn">Keluar</button></div></header>
<main>
<div class="card"><h2>Dashboard</h2><p>Sistem Inventory & Opname PT Lampung Bay Seafood</p></div>
<div class="grid">
<div class="card"><h3>📦 Produk</h3><p>Kelola produk dan barcode.</p></div>
<div class="card"><h3>📊 Inventory</h3><p>Lihat stok barang.</p></div>
<div class="card"><h3>📝 Opname</h3><p>Catat stok fisik dan selisih.</p></div>
<div class="card"><h3>📄 Laporan</h3><p>Export Excel dan PDF.</p></div>
</div>
</main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
